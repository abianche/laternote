name: laternote
description: "A message to the person you'll become."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.4
  flutter_timezone: ^5.1.1

  material_ui: ^1.11.1
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  share_plus: ^13.3.1
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # SIL Open Font License 1.1 (assets/fonts/*-OFL.txt). Both are variable
    # fonts; weights are set with FontVariation.weight.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
