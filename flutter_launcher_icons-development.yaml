# Generated from assets/branding/ (see its README). Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon-development.png
  adaptive_icon_background: "#6F9A8D"
  adaptive_icon_foreground: assets/branding/icon-development-foreground.png
